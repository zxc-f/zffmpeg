# Linux-only checks for the Zig package. Native Windows CI is deferred; see
# TODO.md (T11).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Zig 0.17.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Require the tested Zig version
        run: |
          actual="$(zig version)"
          echo "zig version: $actual"
          test "$actual" = "0.17.0"

      - name: Check formatting
        run: |
          zig fmt --check build.zig build.zig.zon zig/ || {
            zig fmt build.zig build.zig.zon zig/
            git diff
            exit 1
          }

      - name: Require every example to be registered in build.zig
        run: |
          for f in zig/examples/*.zig; do
            grep -qF "\"$f\"" build.zig || { echo "::error file=build.zig::$f is not registered in build.zig"; exit 1; }
          done

      - name: Build (Debug)
        run: zig build --summary all

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe --summary all

      - name: Test (Debug)
        run: zig build test --summary all

      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Test (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast --summary all
