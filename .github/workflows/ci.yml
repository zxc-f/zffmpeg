# Linux checks for the Zig package and the FFmpeg reference comparison.
# Development is verified on Linux only (TODO.md "Platform policy"); other
# targets are compiled but not run, as a portability guard (TODO.md T62-T63).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Zig 0.17.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Require the tested Zig version
        run: |
          actual="$(zig version)"
          echo "zig version: $actual"
          test "$actual" = "0.17.0"

      - name: Check formatting
        run: |
          zig fmt --check build.zig build.zig.zon zig/ || {
            zig fmt build.zig build.zig.zon zig/
            git diff
            exit 1
          }

      - name: Check that the WAV fixtures are current
        run: python3 zig/testing/fixtures/generate.py --check

      - name: Require every example to be registered in build.zig
        run: |
          for f in zig/examples/*.zig; do
            grep -qF "\"$f\"" build.zig || { echo "::error file=build.zig::$f is not registered in build.zig"; exit 1; }
          done

      - name: Build (Debug)
        run: zig build --summary all

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe --summary all

      - name: Test (Debug)
        run: zig build test --summary all

      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Test (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast --summary all

      # Compile-only: cross builds are not native-run evidence.
      - name: Cross-compile without running
        run: |
          for target in x86_64-windows-gnu aarch64-linux-musl aarch64-macos; do
            zig build -Dtarget="$target" -Doptimize=ReleaseSafe -p "zig-out-$target" --summary all
          done

  reference:
    name: FFmpeg reference (Linux, Clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Identify the compiler
        id: compiler
        run: echo "id=$(clang --version | head -n 1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the FFmpeg reference build
        id: ffmpeg-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .references/ffmpeg-install
          key: ffmpeg-reference-ubuntu-24.04-${{ steps.compiler.outputs.id }}-${{ hashFiles('zig/testing/reference/build-ffmpeg.sh') }}

      - name: Build the FFmpeg reference (T03)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash zig/testing/reference/build-ffmpeg.sh .references/ffmpeg-install

      - name: Record the environment and the reference build
        run: |
          echo "runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          uname -srm
          . /etc/os-release && echo "$PRETTY_NAME"
          echo "runner $(clang --version | head -n 1)"
          make --version | head -n 1
          python3 --version
          echo "zig $(zig version)"
          prefix=.references/ffmpeg-install
          "$prefix/bin/ffmpeg" -hide_banner -version
          echo "commit $(cat "$prefix/share/zffmpeg-reference/commit.txt")"
          echo "built with $(cat "$prefix/share/zffmpeg-reference/compiler.txt")"
          sha256sum "$prefix/bin/ffmpeg" "$prefix/bin/ffprobe" "$prefix/share/zffmpeg-reference/config.log"
          echo "fixtures $(cat zig/testing/fixtures/wav/*.wav | sha256sum)"
          echo "au fixtures $(cat zig/testing/fixtures/au/*.au | sha256sum)"

      # The committed T20a oracle must be what this FFmpeg build prints.
      - name: Check the sample-format vectors (T20a)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/samplefmt_vectors.c \
            .references/ffmpeg-install/lib/libavutil.a -lm -pthread -o samplefmt-vectors
          ./samplefmt-vectors | diff -u zig/testing/vectors/samplefmt.txt -

      # The committed T20b oracle must be what this build's PCM codecs give.
      - name: Check the PCM codec vectors (T20b)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/pcm_vectors.c \
            .references/ffmpeg-install/lib/libavcodec.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o pcm-vectors
          ./pcm-vectors | diff -u zig/testing/vectors/pcm.txt -

      # The committed T23b oracle must be what this build's libavutil gives.
      - name: Check the channel layout vectors (T23b)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/layout_vectors.c \
            .references/ffmpeg-install/lib/libavutil.a -lm -pthread -o layout-vectors
          ./layout-vectors | diff -u zig/testing/vectors/layout.txt -

      # The committed T23b `chan` oracle must be what this build's libavformat
      # gives (internal functions of the static library).
      - name: Check the channel layout chunk vectors (T23b)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/chan_vectors.c \
            .references/ffmpeg-install/lib/libavformat.a .references/ffmpeg-install/lib/libavcodec.a \
            .references/ffmpeg-install/lib/libswresample.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o chan-vectors
          ./chan-vectors | diff -u zig/testing/vectors/chan.txt -

      # The committed T23c oracle must be what this build's libswresample gives.
      - name: Check the rematrix vectors (T23c)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/rematrix_vectors.c \
            .references/ffmpeg-install/lib/libswresample.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o rematrix-vectors
          ./rematrix-vectors | diff -u zig/testing/vectors/rematrix.txt -
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/remix_vectors.c \
            .references/ffmpeg-install/lib/libswresample.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o remix-vectors
          ./remix-vectors | diff -u zig/testing/vectors/remix.txt -

      # The committed T17a oracle must be what this build's libavutil gives.
      - name: Check the number syntax vectors (T17a)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/number_vectors.c \
            .references/ffmpeg-install/lib/libavutil.a -lm -pthread -o number-vectors
          ./number-vectors | diff -u zig/testing/vectors/number.txt -
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/options_vectors.c \
            .references/ffmpeg-install/lib/libswresample.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o options-vectors
          ./options-vectors | diff -u zig/testing/vectors/options.txt -

      # The committed T24 oracle must be what this build's libswresample gives.
      - name: Check the resampling vectors (T24)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/resample_vectors.c \
            .references/ffmpeg-install/lib/libswresample.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o resample-vectors
          ./resample-vectors | diff -u zig/testing/vectors/resample.txt -

      # The committed T25c oracle must be what this build's libavfilter gives.
      - name: Check the multi-graph vectors (T25c)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/multigraph_vectors.c \
            .references/ffmpeg-install/lib/libavfilter.a .references/ffmpeg-install/lib/libswscale.a \
            .references/ffmpeg-install/lib/libswresample.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o multigraph-vectors
          ./multigraph-vectors | diff -u zig/testing/vectors/multigraph.txt -

      # The committed T25b oracle must be what this build's libavutil gives.
      - name: Check the expression vectors (T25b)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/eval_vectors.c \
            .references/ffmpeg-install/lib/libavutil.a -lm -pthread -o eval-vectors
          ./eval-vectors | diff -u zig/testing/vectors/eval.txt -

      # The committed T25a oracle must be what this build's libavfilter gives.
      - name: Check the filter graph vectors (T25a)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/graph_vectors.c \
            .references/ffmpeg-install/lib/libavfilter.a .references/ffmpeg-install/lib/libswscale.a \
            .references/ffmpeg-install/lib/libswresample.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o graph-vectors
          ./graph-vectors | diff -u zig/testing/vectors/graph.txt -

      # The committed T23a oracle must be what this build's libswresample gives.
      - name: Check the sample conversion and dither vectors (T23a)
        run: |
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/sampleconv_vectors.c \
            .references/ffmpeg-install/lib/libswresample.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o sampleconv-vectors
          ./sampleconv-vectors | diff -u zig/testing/vectors/sampleconv.txt -
          clang -O1 -I.references/ffmpeg-install/include zig/testing/reference/dither_vectors.c \
            .references/ffmpeg-install/lib/libswresample.a .references/ffmpeg-install/lib/libavutil.a \
            -lm -pthread -o dither-vectors
          ./dither-vectors 2>/dev/null | diff -u zig/testing/vectors/dither.txt -

      - name: Build zffprobe, zffmpeg and the test tools
        run: zig build -Doptimize=ReleaseSafe install test-tools

      - name: Compare with the reference (T10)
        run: |
          python3 zig/testing/reference/compare.py \
            --ffmpeg .references/ffmpeg-install/bin/ffmpeg \
            --ffprobe .references/ffmpeg-install/bin/ffprobe \
            --zffprobe zig-out/bin/zffprobe \
            --writer zig-out/bin/write-driver \
            --zffmpeg zig-out/bin/zffmpeg \
            --registry zig-out/bin/registry-dump \
            --report reference-report.md
          cat reference-report.md >> "$GITHUB_STEP_SUMMARY"
